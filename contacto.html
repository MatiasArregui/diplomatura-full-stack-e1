    </header>
    <!-- Encabezado y menu principal para dispositivos moviles-->
    <header class="container-fluid cabezal-inicio shadow d-md-none">
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
          <div class="d-flex flex-column">
            <h3 class="mb-0">RAM</h3>
            <p class="mb-0">Repuestos de motos</p>
          </div>
          <!-- Button que se desplega -->
          <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" 
                  data-bs-target="#navbarNav" aria-controls="navbarNav" 
                  aria-expanded="false" aria-label="Toggle navigation">

<!------------------------------------------------------------ CONTENIDO PRINCIPAL, DONDE SE MUESTRA EL FORMULARIO-------------------------------------------->
    <main class="container shadow border p-3 form-de-contacto my-5">
      <h2 class="mb-4 text-center">Formulario de Contacto</h2>
      <form>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
        </div>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" placeholder="tuemail@ejemplo.com">
        </div>

        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí"></textarea>
        </div>

        <button type="submit" class="btn btn-danger w-100">Enviar</button>
      </form>
    </main>
<!-------------------------------------- PIE DE PAGINA DE PRINCIPAL Y LAS DERIVADAS ----------------------------------------->
    <footer class="container-fluid pie-de-pagina fixed-bottom d-md-none">

    <footer class="container-fluid pie-de-pagina d-none d-md-flex">
